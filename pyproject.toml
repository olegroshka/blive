[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blive"
version = "0.1.0"
description = "Live algorithmic execution engine — sibling to btest"
readme = "README.md"
requires-python = "==3.11.*"
authors = [{ name = "Oleg Roshka" }]

# Runtime dependencies.
#  - quantdsl-backtest: research/backtesting DSL; engines reused per ADR-010.
#    Pinned via [tool.uv.sources] to the local sibling working copy at ../btest.
#  - ib_async: TWS-API wrapper, used only inside adapters/ib/* per ADR-002 + ADR-004.
#    M2-IB is parked at the M2-substrate-IB.checkpoint commit; the dep stays
#    in place for the eventual return.
#  - httpx: async REST driver for the IG adapter (M2-IG) per ADR-036.
dependencies = [
  "quantdsl-backtest",
  "ib_async>=2.1,<2.2",
  "httpx>=0.27,<0.28",
  # Strategy-config validation (DD-3, ADR-028).
  "pydantic>=2.0,<3.0",
  # YAML loader for blive's per-strategy live config.
  "pyyaml>=6.0",
  # Parquet reader for the M1 PaperMarketData fixture (ADR-029).
  "pandas>=2.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.12",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "black>=24.0",
  "isort>=5.13",
  "import-linter>=2.0",
  "types-pyyaml>=6.0",
  "pandas-stubs>=2.0",
]

[project.urls]
Homepage = "https://github.com/olegroshka/blive"
Repository = "https://github.com/olegroshka/blive"

# --- Build configuration -----------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/blive"]

# --- uv configuration --------------------------------------------------------
# Pin quantdsl-backtest to the local sibling repo (editable). Per the M0 plan
# we depend on the local working copy, not a published package or git URL.

[tool.uv.sources]
quantdsl-backtest = { path = "../btest", editable = true }

# --- pytest configuration ----------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts"]
asyncio_mode = "auto"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "manual: tests requiring external setup (e.g. IB Paper) — not in CI",
]

# --- Linting / formatting ----------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
# btest is not strictly typed end-to-end; allow imports without stub errors.
module = ["quantdsl_backtest.*", "ib_async.*"]
ignore_missing_imports = true

# --- Import-linter contracts (ADR-004, ADR-008) ------------------------------
# Enforced by `lint-imports` (CLI from the import-linter package).

[tool.importlinter]
root_packages = ["blive"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer is broker-neutral (ADR-004)"
type = "forbidden"
source_modules = ["blive.domain"]
forbidden_modules = [
  "blive.adapters",
  "ib_async",
]

[[tool.importlinter.contracts]]
# RiskEngine no-bypass placeholder: when blive.execution lands at M3, this
# contract will forbid blive.strategies / blive.sizing from importing it
# directly. Stub for now; tightened when those packages exist.
name = "RiskEngine no-bypass (ADR-008) — placeholder"
type = "forbidden"
source_modules = ["blive.domain"]
forbidden_modules = ["blive.platform_api", "blive.platform_ui"]

[[tool.importlinter.contracts]]
# Per ADR-034: only blive.runtime.broker_registry may import broker-specific
# adapter packages outside blive.adapters.*. Strategy / Sizer / RiskEngine
# (and any future domain-adjacent component) must resolve a broker via the
# registry rather than reaching into adapters directly. The registry's own
# imports of blive.adapters.{paper,ig,ib} are the intentional load-bearing
# exception. blive.adapters.{clock,memory,alert,shared} are cross-cutting
# helpers and remain freely importable.
name = "Broker registry isolation (ADR-034)"
type = "forbidden"
source_modules = [
  "blive.strategy",
  "blive.sizing",
  "blive.risk",
]
forbidden_modules = [
  "blive.adapters.paper",
  "blive.adapters.ig",
  "blive.adapters.ib",
]
